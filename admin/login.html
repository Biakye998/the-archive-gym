<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — THE ARCHIVE</title>
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">A</div>
        <h1 class="login-title">THE ARCHIVE Admin</h1>
        <p class="login-subtitle">Sign in to manage your business</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary w-full">Sign In</button>
      </form>
      <div class="login-footer">
        <p class="text-small">Demo credentials: admin@thearchive.ch / archive2024</p>
      </div>
    </div>
  </div>
  <script src="/assets/js/api-client.js"></script>
  <script>
    (function() {
      var form = document.getElementById('login-form');
      var errorEl = document.getElementById('login-error');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorEl.textContent = '';
        errorEl.style.display = 'none';

        var btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        try {
          var res = await window.adminAPI.login(
            form.email.value.trim(),
            form.password.value
          );

          if (res.ok) {
            window.location.href = '/admin/#/dashboard';
          } else {
            errorEl.textContent = res.data?.error || 'Invalid credentials';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign In';
          }
        } catch (err) {
          errorEl.textContent = 'Connection error. Please try again.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
